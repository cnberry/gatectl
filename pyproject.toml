[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gatectl"
version = "0.2.0"
description = "MyQ gate and garage-door status probe with guarded operation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Chris Berry"}]
keywords = ["myq", "liftmaster", "garage-door", "gate", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = ["detect-secrets>=1.5,<2", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/cnberry/gatectl"
Issues = "https://github.com/cnberry/gatectl/issues"

[project.scripts]
gatectl = "gatectl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
